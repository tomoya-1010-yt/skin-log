name: アプリのデプロイ

on:
  push:
    branches: [main]
    paths: ["web/**", "functions/**", "migrations/**", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages プロジェクトを用意 (初回のみ作成)
        run: npx --yes wrangler@4 pages project create skin-log --production-branch=main || true
      - name: DB のテーブルを更新
        run: npx --yes wrangler@4 d1 migrations apply skin-log --remote
      - name: 合言葉と連携用トークンを登録
        env:
          APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -z "$APP_PASSPHRASE" ]; then echo "Secret APP_PASSPHRASE が空です"; exit 1; fi
          if [ -z "$INGEST_TOKEN" ]; then echo "Secret INGEST_TOKEN が空です"; exit 1; fi
          printf '%s' "$APP_PASSPHRASE" | npx --yes wrangler@4 pages secret put APP_PASSPHRASE --project-name skin-log
          printf '%s' "$INGEST_TOKEN" | npx --yes wrangler@4 pages secret put INGEST_TOKEN --project-name skin-log
      - name: デプロイ
        run: npx --yes wrangler@4 pages deploy --project-name skin-log --branch main
