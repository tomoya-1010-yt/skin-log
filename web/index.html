<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="肌ログ">
  <meta name="robots" content="noindex, nofollow">
  <title>肌ログ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" id="top">
    <div class="top-row">
      <button id="prev-day" class="nav-btn" aria-label="前の日" hidden>‹</button>
      <h1 id="title">肌ログ</h1>
      <button id="next-day" class="nav-btn" aria-label="次の日" hidden>›</button>

  </header>

  <main id="main">
    <p class="empty">読み込み中…</p>
  </main>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="record"><span class="ico">✎</span>記録</button>
    <button data-tab="history"><span class="ico">▦</span>履歴</button>
    <button data-tab="report"><span class="ico">✦</span>レポート</button>
    <button data-tab="products"><span class="ico">⚗︎</span>化粧品</button>
    <button data-tab="settings"><span class="ico">⚙︎</span>設定</button>
  </nav>

  <script src="app.js"></script>
  <script src="products.js"></script>
